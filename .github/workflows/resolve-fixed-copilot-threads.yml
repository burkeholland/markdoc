# Copilot cloud automations can reply to review threads but can't resolve them,
# and the main ruleset requires resolved conversations before merge.
# This resolves a thread only when all of these hold:
#   - Copilot code review started the thread
#   - the repo owner (the automation's identity) replied "Fixed in <full 40-char sha>"
#   - <sha> is the PR's current head
#   - Copilot's latest review of that head added no new comments
name: Resolve fixed Copilot threads

on:
  pull_request_review:
    types: [submitted]
  # Runs started by Copilot's own reviews fail before any job starts, so also run on the
  # automation's hourly "REVIEW RETRY/DONE" PR comments.
  issue_comment:
    types: [created]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: resolve-copilot-threads
  cancel-in-progress: false

jobs:
  resolve:
    if: github.event_name != 'issue_comment' || (github.event.issue.pull_request && startsWith(github.event.comment.body, 'REVIEW '))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const REVIEWER = "copilot-pull-request-reviewer";
            const currentHead = async (pull_number) =>
              (await github.rest.pulls.get({ owner, repo, pull_number })).data.head.sha;
            const triggerPr = context.payload.pull_request ?? context.payload.issue;
            const prNumbers = triggerPr
              ? [triggerPr.number]
              : (await github.paginate(github.rest.pulls.list, { owner, repo, state: "open", per_page: 100 }))
                  .map((p) => p.number);

            for (const number of prNumbers) {
              const { repository } = await github.graphql(
                `query($owner:String!,$repo:String!,$number:Int!){
                  repository(owner:$owner,name:$repo){
                    pullRequest(number:$number){
                      state headRefName headRefOid
                      reviews(last:100){pageInfo{hasPreviousPage} nodes{author{login} commit{oid} submittedAt comments{totalCount}}}
                      reviewThreads(first:100){pageInfo{hasNextPage} nodes{id isResolved
                        comments(first:100){pageInfo{hasNextPage} nodes{author{login} body}}}}
                    }}}`,
                { owner, repo, number }
              );
              const pr = repository.pullRequest;
              if (pr.state !== "OPEN" || !pr.headRefName.startsWith("copilot/")) continue;
              const head = pr.headRefOid;
              // Fail closed: if any list is truncated, leave the PR for a person.
              if (pr.reviews.pageInfo.hasPreviousPage || pr.reviewThreads.pageInfo.hasNextPage ||
                  pr.reviewThreads.nodes.some((t) => t.comments.pageInfo.hasNextPage)) {
                core.warning(`#${number}: too many reviews, threads or comments to check; skipping`);
                continue;
              }

              const latest = pr.reviews.nodes
                .filter((r) => r.author?.login === REVIEWER && r.commit?.oid === head)
                .sort((a, b) => a.submittedAt.localeCompare(b.submittedAt))
                .pop();
              if (!latest || latest.comments.totalCount !== 0) {
                core.info(`#${number}: no clean Copilot review of ${head.slice(0, 7)}; skipping`);
                continue;
              }

              for (const t of pr.reviewThreads.nodes) {
                if (t.isResolved) continue;
                const [first, ...replies] = t.comments.nodes;
                if (first?.author?.login !== REVIEWER) continue;
                const fixed = replies.some((c) => {
                  const m = c.author?.login === owner && /^Fixed in ([0-9a-f]{40})\b/.exec(c.body.trim());
                  return m && m[1] === head;
                });
                if (!fixed) continue;
                if ((await currentHead(number)) !== head) {
                  core.warning(`#${number}: head moved; stopping`);
                  break;
                }
                await github.graphql(
                  `mutation($id:ID!){resolveReviewThread(input:{threadId:$id}){thread{isResolved}}}`,
                  { id: t.id }
                );
                if ((await currentHead(number)) !== head) {
                  await github.graphql(
                    `mutation($id:ID!){unresolveReviewThread(input:{threadId:$id}){thread{isResolved}}}`,
                    { id: t.id }
                  );
                  core.warning(`#${number}: head moved during resolve; reopened ${t.id} and stopped`);
                  break;
                }
                core.notice(`#${number}: resolved Copilot thread ${t.id} (fixed in ${head.slice(0, 7)})`);
              }
            }
