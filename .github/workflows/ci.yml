name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret

  e2e:
    # ~130 tests; one worker on the 2-vCPU runner ran past the 30-min cap. Two shards with two workers
    # each (playwright.config.ts under CI) keep every job well inside it; fail-fast off so a red shard
    # still lets the other finish and report. e2e/scale.spec.ts (the Burke-scale fixture: ~3 min
    # locally, budgets via budgetMs) rides in these shards; give it its own job if it grows past 5 min.
    name: End-to-end (Playwright) ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/2
        env:
          CI: "1"
          NEXT_TELEMETRY_DISABLED: "1"
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  image:
    name: Container image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: markdoc:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
