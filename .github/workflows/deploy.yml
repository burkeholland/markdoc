# Production release to the Enterprise VM, run on GitHub-hosted runners (public npm registry).
# Runs once a day and releases only if main has changed beyond docs since the version production reports.
# Starting it by hand always releases. One-time Azure/GitHub setup: deploy/github-actions-setup.md
name: Deploy to Azure

on:
  schedule:
    # 5:07 p.m. PST, 6:07 p.m. PDT. GitHub can start a scheduled run late.
    - cron: "7 1 * * *"
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-hex commit to release. Blank = current main HEAD.
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

concurrency:
  group: markdoc-production
  cancel-in-progress: false

jobs:
  # Holds no Azure or production access. The workflow-level concurrency group means it reads health only after
  # any earlier release has finished.
  check:
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      release: ${{ steps.decide.outputs.release }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Compare main with the version production reports
        id: decide
        shell: pwsh
        run: ./deploy/release-decision.ps1

  deploy:
    needs: check
    # check is skipped on a manual run, and !cancelled() lets that through. A scheduled run needs a passing check.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && needs.check.result == 'success' && needs.check.outputs.release == 'true'))
    runs-on: windows-latest
    timeout-minutes: 99
    environment: production
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 5
        with:
          ref: main
          fetch-depth: 0
      - name: Pin the release commit
        id: pin
        shell: pwsh
        env:
          # A scheduled run releases the commit check compared, even if main has moved since.
          INPUT_SHA: ${{ inputs.sha || needs.check.outputs.sha }}
        run: |
          $sha = if ($env:INPUT_SHA) { $env:INPUT_SHA.Trim().ToLowerInvariant() } else { (git rev-parse HEAD).Trim() }
          if ($sha -cnotmatch '^[0-9a-f]{40}$') { throw 'sha must be a full 40-hex commit.' }
          git merge-base --is-ancestor $sha origin/main
          if ($LASTEXITCODE -ne 0) { throw "$sha is not on main." }
          git checkout -B main $sha
          if ($LASTEXITCODE -ne 0) { throw 'checkout failed.' }
          "sha=$sha" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@v5
        timeout-minutes: 5
        with:
          node-version: 22
      - uses: azure/login@v2
        timeout-minutes: 5
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # Runs the dependency preflight (npm audit + accepted-advisory policy), ACR build, VM rollout
      # and its own exact-SHA public health check.
      - name: Release the exact commit to the Enterprise VM
        shell: pwsh
        timeout-minutes: 79
        env:
          RELEASE_SHA: ${{ steps.pin.outputs.sha }}
        run: ./deploy/release-vm.ps1 -ExpectedCommit $env:RELEASE_SHA -Target Enterprise
      - name: Final no-cache health check
        shell: pwsh
        env:
          RELEASE_SHA: ${{ steps.pin.outputs.sha }}
        run: |
          $h = Invoke-RestMethod -Uri "https://markdoc.app/api/health?nocache=$([guid]::NewGuid().ToString('N'))" `
            -Headers @{ 'Cache-Control' = 'no-cache'; 'Pragma' = 'no-cache' } -TimeoutSec 20
          $h | ConvertTo-Json -Compress
          if ($h.version -cne $env:RELEASE_SHA -or $h.ok -ne $true -or $h.db -ne $true -or $h.collab -ne $true) {
            throw "Health mismatch: expected version $env:RELEASE_SHA with ok/db/collab true."
          }
