# Manual deployment to the existing Markdoc VM. Never runs on its own.
#
# One-time setup:
#  1. Run deploy/azure.ps1 -InitializeDatabase -ConfigureRecovery once locally.
#  2. Create an Entra app with federated credentials for this repo (OIDC) and give it
#     Contributor + AcrPush on the resource group. Add repository secrets:
#       AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#     and repository variables:
#       AZURE_RESOURCE_GROUP (e.g. markdoc-rg), AZURE_ACR_NAME (from the Bicep output)
name: Deploy to Azure (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "deploy" to confirm
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: markdoc-production
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build image in ACR
        run: |
          SHORT_TAG=${GITHUB_SHA::12}
          az acr build -r "${{ vars.AZURE_ACR_NAME }}" -t "markdoc:$GITHUB_SHA" -t "markdoc:$SHORT_TAG" --build-arg "APP_VERSION=$GITHUB_SHA" --file Dockerfile .
          DIGEST=$(az acr manifest list-metadata -r "${{ vars.AZURE_ACR_NAME }}" -n markdoc --query "[?tags != null && contains(tags, '$GITHUB_SHA')] | [0].digest" -o tsv)
          test -n "$DIGEST"
          echo "IMAGE=$(az acr show -n "${{ vars.AZURE_ACR_NAME }}" --query loginServer -o tsv)/markdoc@$DIGEST" >> "$GITHUB_ENV"
      - name: Roll the VM-hosted application
        run: |
          REGISTRY=$(az acr show -n "${{ vars.AZURE_ACR_NAME }}" --query loginServer -o tsv)
          OPERATION=$(tr 'A-F' 'a-f' </proc/sys/kernel/random/uuid)
          RESULT=$(az vm run-command invoke \
            -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
            -n markdoc-pg \
            --command-id RunShellScript \
            --scripts @infra/release-wal-gate.sh @infra/deploy-vm-image.sh \
            --parameters "$REGISTRY" "$IMAGE" "$GITHUB_SHA" "${{ secrets.AZURE_TENANT_ID }}" "$OPERATION" \
            --query "value[0].message" -o tsv)
          printf '%s\n' "$RESULT"
          grep -Eq "^markdoc-release-wal-ready:${OPERATION}:[0-9A-F]+/[0-9A-F]+:([0-9A-F]{24}):\1-[0-9a-f]{40}(\.(bz2|gz|lz4|zst))?:[0-9A-F]+/[0-9A-F]+$" <<<"$RESULT"
          grep -q '^markdoc-vm-image-ready$' <<<"$RESULT"
          grep -q "^markdoc-vm-image-operation-ready:${OPERATION}$" <<<"$RESULT"
          FQDN=$(az network public-ip show -n markdoc-web-ip -g "${{ vars.AZURE_RESOURCE_GROUP }}" --query dnsSettings.fqdn -o tsv)
          echo "Deployed https://$FQDN"
          HEALTH=$(curl -fsS "https://$FQDN/api/health")
          test "$(jq -r '.ok and .db and .collab' <<<"$HEALTH")" = true
          test "$(jq -r '.version' <<<"$HEALTH")" = "$GITHUB_SHA"
