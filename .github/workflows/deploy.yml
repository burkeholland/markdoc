# Manual deployment to the existing Markdoc VM. Never runs on its own.
#
# One-time setup:
#  1. Run deploy/azure.ps1 -InitializeDatabase -ConfigureRecovery once locally.
#  2. Create an Entra app with federated credentials for this repo (OIDC) and give it
#     Contributor + AcrPush on the resource group. Add repository secrets:
#       AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
name: Deploy to Azure (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "deploy" to confirm
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: markdoc-production
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.confirm == 'deploy'
    runs-on: windows-latest
    # Three five-minute setup caps plus the 79-minute release step leave five minutes for runner post-steps.
    timeout-minutes: 99
    environment: production
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      - uses: actions/setup-node@v5
        timeout-minutes: 5
        with:
          node-version: 22
      - uses: azure/login@v2
        timeout-minutes: 5
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Release the exact commit to the VM
        shell: pwsh
        timeout-minutes: 79
        run: ./deploy/release-vm.ps1 -ExpectedCommit $env:GITHUB_SHA
