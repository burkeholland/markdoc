# Manual deployment to Azure Container Apps. Never runs on its own.
#
# One-time setup:
#  1. Run deploy/azure.ps1 -InitializeDatabase -ConfigureRecovery once locally.
#  2. Create an Entra app with federated credentials for this repo (OIDC) and give it
#     Contributor + AcrPush on the resource group. Add repository secrets:
#       AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#     and repository variables:
#       AZURE_RESOURCE_GROUP (e.g. markdoc-rg), AZURE_ACR_NAME (from the Bicep output), AZURE_APP_NAME (markdoc)
name: Deploy to Azure (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "deploy" to confirm
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: markdoc-production
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build image in ACR
        run: |
          SHORT_TAG=${GITHUB_SHA::12}
          az acr build -r "${{ vars.AZURE_ACR_NAME }}" -t "markdoc:$GITHUB_SHA" -t "markdoc:$SHORT_TAG" --build-arg "APP_VERSION=$GITHUB_SHA" --file Dockerfile .
          DIGEST=$(az acr manifest list-metadata -r "${{ vars.AZURE_ACR_NAME }}" -n markdoc --query "[?tags != null && contains(tags, '$GITHUB_SHA')] | [0].digest" -o tsv)
          test -n "$DIGEST"
          echo "IMAGE=$(az acr show -n "${{ vars.AZURE_ACR_NAME }}" --query loginServer -o tsv)/markdoc@$DIGEST" >> "$GITHUB_ENV"
      - name: Roll the Container App
        run: |
          az containerapp update -n "${{ vars.AZURE_APP_NAME }}" -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "$IMAGE" --set-env-vars "APP_VERSION=$GITHUB_SHA"
          FQDN=$(az containerapp show -n "${{ vars.AZURE_APP_NAME }}" -g "${{ vars.AZURE_RESOURCE_GROUP }}" --query properties.configuration.ingress.fqdn -o tsv)
          echo "Deployed https://$FQDN"
          sleep 20
          HEALTH=$(curl -fsS "https://$FQDN/api/health")
          test "$(jq -r '.ok and .db' <<<"$HEALTH")" = true
          test "$(jq -r '.version' <<<"$HEALTH")" = "$GITHUB_SHA"
