<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Favicon: the mark in the accent (teal #0f766e in light tabs; the lighter dark-mode teal #2dd4bf with ink glyph on dark tabs, where the deep teal would sink into the strip). -->
  <style>
    .body { fill: #0f766e; }
    .fold { fill: #ffffff; fill-opacity: 0.42; }
    .glyph { stroke: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .body { fill: #2dd4bf; }
      .fold { fill: #14161a; fill-opacity: 0.28; }
      .glyph { stroke: #14161a; }
    }
  </style>
  <path class="body" d="M9 2h12l9 9v12a7 7 0 0 1-7 7H9a7 7 0 0 1-7-7V9a7 7 0 0 1 7-7z"/>
  <path class="fold" d="M21 2v6a3 3 0 0 0 3 3h6z"/>
  <path class="glyph" d="M10 13.5h13M9 19.5h13M14.5 9.5l-2 13M20 9.5l-2 13" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>