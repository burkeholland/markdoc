# Ubuntu 24.04's stock nginx.conf includes conf.d/*.conf inside http {}, so this
# file sets the HTTP-level value before nginx loads the Markdoc server names.
# Install as /etc/nginx/conf.d/markdoc-server-names-hash.conf on the production VM.
# The 64 in nginx's error is the current default; use the next power of two.
server_names_hash_bucket_size 128;
