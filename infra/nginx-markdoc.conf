# /etc/nginx/sites-available/markdoc on the production VM (markdoc-pg).
# Canonical origin: https://markdoc.app. www.markdoc.app and the retired Azure
# name markdoc-burkeholland.eastus2.cloudapp.azure.com redirect to it.
# Pages get 301; /api/* gets 308 so POST/PUT from MCP clients and scripts that
# still use an old origin keep their method and body. See docs/vm-hosting.md.

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# Plain HTTP on any name: send to HTTPS on the canonical origin. Certbot's
# nginx authenticator adds its own ACME challenge location during renewal.
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name markdoc.app www.markdoc.app markdoc-burkeholland.eastus2.cloudapp.azure.com _;

  location /api/ { return 308 https://markdoc.app$request_uri; }
  location / { return 301 https://markdoc.app$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl ipv6only=on;
  server_name markdoc.app;

  ssl_certificate /etc/letsencrypt/live/markdoc.app/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/markdoc.app/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  # The largest request body nginx passes on. nginx's default is 1m, which refused picture
  # uploads, imports and agent requests that the app allows (issue #2339). 10m (10 MiB) is the
  # largest body the app can read: Next keeps only the first 10 MiB of a body that passes
  # src/proxy.ts and hands the route a cut body after that. The app's own limits are all below
  # it: a picture 5 MiB (src/server/assets.ts), a document's text 2,000,000 characters (about
  # 6 MB as JSON when every character takes three bytes), /api/mcp 4 MiB, an imported file 2 MiB
  # (src/server/import-file.ts). A larger body is refused here with 413 from its Content-Length,
  # before any of it is read. server/nginx-body-limit.test.ts fails when this value and those
  # limits drift apart.
  client_max_body_size 10m;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # The peer nginx itself saw. Unlike X-Forwarded-For this replaces a client-sent value, so the app
    # can key its per-IP limits on it (#2324). src/server/rate-limit.ts clientIp() reads it.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name www.markdoc.app;

  ssl_certificate /etc/letsencrypt/live/markdoc.app/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/markdoc.app/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  # Same value as the markdoc.app block. nginx checks the body size before it runs a `return`
  # inside a location, so with the 1m default a POST over 1 MB to this origin got nginx's 413
  # instead of the 308 below.
  client_max_body_size 10m;

  location /api/ { return 308 https://markdoc.app$request_uri; }
  location / { return 301 https://markdoc.app$request_uri; }
}

# Retired Azure hostname: keep its own certificate (certbot still renews it)
# so old shared links redirect instead of failing TLS.
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name markdoc-burkeholland.eastus2.cloudapp.azure.com;

  ssl_certificate /etc/letsencrypt/live/markdoc-burkeholland.eastus2.cloudapp.azure.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/markdoc-burkeholland.eastus2.cloudapp.azure.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  # Same value as the markdoc.app block, for the same reason as on www.markdoc.app.
  client_max_body_size 10m;

  location /api/ { return 308 https://markdoc.app$request_uri; }
  location / { return 301 https://markdoc.app$request_uri; }
}
